name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade build jsonschema
      - run: python -m unittest discover -s validator -p 'test*.py' -v
      - run: python -m unittest discover -s tests -p 'test*.py' -v
      - run: python tools/full_schema_check.py
      - run: python tools/version_check.py
      - run: python -m build
      - run: sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
