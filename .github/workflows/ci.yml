name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[schema]'
      - run: python -m unittest discover -s validator -p 'test*.py' -v
      - run: python -m unittest discover -s tests -p 'test*.py' -v
      - run: python validator/validate.py --project examples/quickstart-demo
      - run: python tools/full_schema_check.py
      - run: python tools/version_check.py
      - run: python tools/build_dashboard.py --check
      - run: python tools/portability_check.py
      - run: content-publishing version
      - run: content-publishing --root . doctor
