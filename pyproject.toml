[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "content-publishing-sop"
version = "0.2.0"
description = "Cross-IDE content production, validation and publishing governance toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "content-publishing-sop contributors"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/372790111z-wq/content-publishing-sop"
Repository = "https://github.com/372790111z-wq/content-publishing-sop"
Issues = "https://github.com/372790111z-wq/content-publishing-sop/issues"

[project.scripts]
content-publishing = "content_publishing.cli:main"

[project.optional-dependencies]
schema = ["jsonschema>=4.18"]
dev = ["jsonschema>=4.18", "build>=1.2"]

[tool.setuptools]
packages = ["content_publishing"]

[tool.setuptools.package-data]
content_publishing = ["platforms.json"]
